name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Restore
        run: dotnet restore Triviador.sln
      - name: Build (Domain/Application/Infrastructure/Web, client build skipped here)
        run: dotnet build Triviador.sln --configuration Release --no-restore -p:SkipClientBuild=true

  typecheck-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/Triviador.Client/package-lock.json
      - name: Install
        working-directory: src/Triviador.Client
        run: npm ci
      - name: Typecheck
        working-directory: src/Triviador.Client
        run: npx tsc -b --noEmit

  docker-publish-smoke-test:
    runs-on: ubuntu-latest
    needs: [build-dotnet, typecheck-client]
    steps:
      - uses: actions/checkout@v4
      - name: Build production image (exercises the exact publish path Render will run)
        run: docker build -t triviador:ci .

  # Applies pending EF Core migrations against the production (Neon) Postgres database before the
  # app itself is deployed - see add-user-auth/design.md Decision 8. The runtime container has no
  # .NET SDK/dotnet-ef, so this has to happen here in CI, not on app startup or inside the image.
  migrate-database:
    runs-on: ubuntu-latest
    needs: [docker-publish-smoke-test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef
      - name: Restore
        run: dotnet restore Triviador.sln
      - name: Apply migrations
        run: |
          if [ -z "${{ secrets.NEON_CONNECTION_STRING }}" ]; then
            echo "NEON_CONNECTION_STRING secret is not set - failing rather than deploying against an out-of-date schema." >&2
            exit 1
          fi
          dotnet ef database update \
            --project src/Triviador.Infrastructure \
            --startup-project src/UI/Triviador.Web \
            --connection "${{ secrets.NEON_CONNECTION_STRING }}"

  deploy:
    runs-on: ubuntu-latest
    needs: [migrate-database]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Trigger Render deploy
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret is not set - skipping deploy trigger." >&2
            exit 1
          fi
          curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
