name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      git_ref:
        description: 'Commit SHA, branch, or tag to build/migrate/deploy (defaults to the ref this run was dispatched from)'
        required: false
        default: ''

jobs:
  build-dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.git_ref || github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Restore
        run: dotnet restore Triviador.sln
      - name: Build (Domain/Application/Infrastructure/Web, client build skipped here)
        run: dotnet build Triviador.sln --configuration Release --no-restore -p:SkipClientBuild=true

  typecheck-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.git_ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/Triviador.Client/package-lock.json
      - name: Install
        working-directory: src/Triviador.Client
        run: npm ci
      - name: Typecheck
        working-directory: src/Triviador.Client
        run: npx tsc -b --noEmit

  docker-publish-smoke-test:
    runs-on: ubuntu-latest
    needs: [build-dotnet, typecheck-client]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.git_ref || github.sha }}
      - name: Build production image (exercises the exact publish path Render will run)
        run: docker build -t triviador:ci .

  # Applies pending EF Core migrations against the production (Neon) Postgres database before the
  # app itself is deployed - see add-user-auth/design.md Decision 8. The runtime container has no
  # .NET SDK/dotnet-ef, so this has to happen here in CI, not on app startup or inside the image.
  migrate-database:
    runs-on: ubuntu-latest
    needs: [docker-publish-smoke-test]
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
      || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.git_ref || github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef
      - name: Restore
        run: dotnet restore Triviador.sln
      - name: Normalize connection string
        id: conn
        env:
          RAW_CONN: ${{ secrets.NEON_CONNECTION_STRING }}
        run: |
          if [ -z "$RAW_CONN" ]; then
            echo "NEON_CONNECTION_STRING secret is not set - failing rather than deploying against an out-of-date schema." >&2
            exit 1
          fi
          # Neon's dashboard hands out a libpq URI (postgresql://user:pass@host/db?sslmode=require),
          # but Npgsql's connection string parser only understands ADO.NET keyword=value pairs.
          # Convert when the secret is in URI form; pass it through unchanged otherwise.
          conn=$(python3 - <<'PYEOF'
          import os, urllib.parse
          raw = os.environ["RAW_CONN"]
          if raw.startswith("postgres://") or raw.startswith("postgresql://"):
              u = urllib.parse.urlparse(raw)
              q = urllib.parse.parse_qs(u.query)
              sslmode = q.get("sslmode", ["require"])[0].capitalize()
              def esc(v):
                  return "'" + v.replace("'", "''") + "'" if any(c in v for c in ";'\"") else v
              parts = {
                  "Host": u.hostname,
                  "Port": str(u.port or 5432),
                  "Database": u.path.lstrip("/"),
                  "Username": esc(urllib.parse.unquote(u.username or "")),
                  "Password": esc(urllib.parse.unquote(u.password or "")),
                  "Ssl Mode": sslmode,
              }
              print(";".join(f"{k}={v}" for k, v in parts.items()))
          else:
              print(raw)
          PYEOF
          )
          echo "::add-mask::$conn"
          echo "connection_string=$conn" >> "$GITHUB_OUTPUT"
      - name: Apply migrations
        run: |
          dotnet ef database update \
            --project src/Triviador.Infrastructure \
            --startup-project src/UI/Triviador.Web \
            --connection "${{ steps.conn.outputs.connection_string }}"

  deploy:
    runs-on: ubuntu-latest
    needs: [migrate-database]
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
      || github.event_name == 'workflow_dispatch'
    steps:
      - name: Trigger Render deploy
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret is not set - skipping deploy trigger." >&2
            exit 1
          fi
          curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
