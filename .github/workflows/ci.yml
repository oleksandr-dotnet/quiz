name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Restore
        run: dotnet restore Triviador.sln
      - name: Build (Domain/Application/Infrastructure/Web, client build skipped here)
        run: dotnet build Triviador.sln --configuration Release --no-restore -p:SkipClientBuild=true

  typecheck-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/Triviador.Client/package-lock.json
      - name: Install
        working-directory: src/Triviador.Client
        run: npm ci
      - name: Typecheck
        working-directory: src/Triviador.Client
        run: npx tsc -b --noEmit

  docker-publish-smoke-test:
    runs-on: ubuntu-latest
    needs: [build-dotnet, typecheck-client]
    steps:
      - uses: actions/checkout@v4
      - name: Build production image (exercises the exact publish path Render will run)
        run: docker build -t triviador:ci .

  deploy:
    runs-on: ubuntu-latest
    needs: [docker-publish-smoke-test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Trigger Render deploy
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret is not set - skipping deploy trigger." >&2
            exit 1
          fi
          curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
