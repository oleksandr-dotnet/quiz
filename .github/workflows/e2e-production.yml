name: E2E (production)

# Verification of the live Render deployment, not a per-commit gate - see
# openspec/changes/base-assault-bonus-and-numeric-tiebreak/design.md's "Running the suite against
# production" decision. Some scenarios (reaching Battle's round-8 base-assault unlock) legitimately
# take several minutes for real, so this intentionally does not run on every push - instead it runs
# once nightly (schedule, below) plus on demand (workflow_dispatch).
#
# Cron is always UTC and does not observe daylight saving - 12:00 UTC is 15:00 in Europe/Kiev during
# EEST (summer, UTC+3); it reads as 14:00 there once clocks fall back to EET (UTC+2) in winter.
# Adjust the cron expression by an hour at the DST boundary if a fixed local wall-clock time matters.
on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'URL of the deployment to test against'
        required: false
        default: 'https://quiz-l0e2.onrender.com'

jobs:
  e2e-production:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Install Playwright suite dependencies
        working-directory: tests/e2e
        run: npm ci

      - name: Install Playwright chromium
        working-directory: tests/e2e
        run: npx playwright install --with-deps chromium

      - name: Run E2E suite against production
        working-directory: tests/e2e
        env:
          # workflow_dispatch's own default only applies to its input UI, not to this expression - a
          # scheduled run has no `inputs` at all, and an empty dispatch input is an empty string, not
          # unset, so both cases need this explicit fallback to actually reach production.
          E2E_BASE_URL: ${{ github.event.inputs.base_url || 'https://quiz-l0e2.onrender.com' }}
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
          retention-days: 14
