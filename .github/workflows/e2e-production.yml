name: E2E (production)

# Manually triggered verification of the live Render deployment, not a per-commit gate - see
# openspec/changes/base-assault-bonus-and-numeric-tiebreak/design.md's "Running the suite against
# production" decision. Some scenarios (reaching Battle's round-8 base-assault unlock) legitimately
# take several minutes for real, so this intentionally does not run on every push.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'URL of the deployment to test against'
        required: false
        default: 'https://quiz-l0e2.onrender.com'

jobs:
  e2e-production:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Install Playwright suite dependencies
        working-directory: tests/e2e
        run: npm ci

      - name: Install Playwright chromium
        working-directory: tests/e2e
        run: npx playwright install --with-deps chromium

      - name: Run E2E suite against production
        working-directory: tests/e2e
        env:
          E2E_BASE_URL: ${{ github.event.inputs.base_url }}
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
          retention-days: 14
